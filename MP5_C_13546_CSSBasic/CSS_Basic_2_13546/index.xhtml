<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <title>Tugas 2 - Embedded Style Sheet</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <style type="text/css">
    body {
      font-family: Georgia, serif;
      background-color: #fff8ed;
      color: #493a2d;
      margin: 30px;
    }
    h1 {
      color: #9a3412;
      text-align: center;
      border-bottom: 2px solid #fb923c;
      padding-bottom: 10px;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
    }
    .kartu {
      background-color: #ffffff;
      border: 1px solid #fed7aa;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>CSS Basic - Tugas 2</h1>
  <p class="kartu">Ini adalah contoh <strong>Embedded Style Sheet</strong>. Aturan CSS ditulis di dalam elemen <code>style</code> pada bagian <code>head</code>.</p>
  <p style="text-align: center;">NPM: 250713546 | Kelas: C</p>
</body>
</html>
